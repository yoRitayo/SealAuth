services:
  db:
    image: postgres:15-alpine
    container_name: seal_banco
    restart: always
    environment:
      POSTGRES_DB: ${BANCO_NOME}
      POSTGRES_USER: ${BANCO_USUARIO}
      POSTGRES_PASSWORD: ${BANCO_SENHA}
      BANCO_APP_USUARIO: ${BANCO_APP_USUARIO}
      BANCO_APP_SENHA: ${BANCO_APP_SENHA}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-network

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer_proxy
    restart: always
    environment:
      - DB_HOST=db          
      - DB_PORT=5432    
      - DB_USER=${BANCO_APP_USUARIO}
      - DB_PASSWORD=${BANCO_APP_SENHA}
      - DB_NAME=${BANCO_NOME}
      - POOL_MODE=transaction
      - AUTH_TYPE=scram-sha-256
    depends_on:
      - db
    networks:               
      - app-network

  backend:
    build: 
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: seal_backend
    restart: always
    ports:
      - "8001:8000"
    environment:
      - APP_DB_USUARIO=${BANCO_APP_USUARIO}
      - APP_DB_SENHA=${BANCO_APP_SENHA}
      - APP_DB_HOST=pgbouncer
      - APP_DB_PORTA=5432
      - ADMIN_DB_USUARIO=${BANCO_USUARIO}
      - ADMIN_DB_SENHA=${BANCO_SENHA}
      - ADMIN_DB_HOST=db
      - ADMIN_DB_PORTA=5432
      - BANCO_NOME=${BANCO_NOME}
      - FRONTEND_URL=${FRONTEND_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_SENHA=${SMTP_SENHA}
      - SMTP_REMETENTE=${SMTP_REMETENTE}
      - ATIVACAO_TOKEN_TTL_HORAS=${ATIVACAO_TOKEN_TTL_HORAS}
      - REDEFINICAO_TOKEN_TTL_MINUTOS=${REDEFINICAO_TOKEN_TTL_MINUTOS}
      - ENV=${AMBIENTE_PYTHON}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - CHAVES_DIR=/app/keys
    volumes:
      # chaves AES, HMAC e RSA geradas por src/backend/scripts/gerar_chaves.py
      - ./keys:/app/keys:ro
    secrets:
      - jwt_secret
    depends_on:
      - pgbouncer
      - redis
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: seal_redis
    restart: always
    # AOF: mantém as sessões de refresh token depois de um restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - app-network

  frontend:
    build: 
      context: ./src/frontend
      dockerfile: Dockerfile

    container_name: seal_front
    restart: always
    ports:
      - "3006:3000"
    environment:
      - VITE_AMBIENTE_NODE=${VITE_AMBIENTE_NODE}
      - VITE_API_URL=http://localhost:8001 
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  pgdata:
  redisdata:

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt

networks:
  app-network:
    driver: bridge
